<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>GOLD GYM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout concept: public site is led by a turning weight plate on a navy ground; the admin side is a fixed sidebar with dense tables and one orange accent. Single dark look by design (navy + orange brand). */
:root{
  --bg:#0A0F1C; --bg-2:#0D1424; --surface:#111A2D; --surface-2:#17223A;
  --line:#223050; --line-2:#2D3F66;
  --fg:#EDF0F7; --muted:#8C98B8; --faint:#62709A;
  --accent:#13b1e1; --accent-2:#13b1e1; --accent-ink:#140800; --accent-soft:rgba(255,107,26,.15);
  --ok:#2FCB7C; --ok-soft:rgba(47,203,124,.15);
  --warn:#F6C445; --warn-soft:rgba(246,196,69,.15);
  --bad:#FF5A73; --bad-soft:rgba(255,90,115,.15);
  --paper:#F2F4F8; --paper-ink:#0B1020; --paper-line:#C9D0E0;
  --font-display:'Big Shoulders Display','Oswald','Arial Narrow',Impact,sans-serif;
  --font-body:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 14px/1.55 var(--font-body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,h4,p,ul{margin:0;padding:0}
ul{list-style:none}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{flex:none}
.wrap{width:100%;max-width:1160px;margin-inline:auto;padding-inline:20px}
.mono{font-family:var(--font-mono);font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.sep{font-weight:700;padding-top:6px;border-top:1px solid var(--line);color:var(--fg)}
.right{text-align:right}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 18px;border-radius:10px;border:1px solid transparent;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px;transition:background .15s,border-color .15s,transform .05s;white-space:nowrap}
.btn:hover{background:var(--accent-2)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line-2)}
.btn.ghost:hover{background:var(--surface-2);border-color:var(--faint)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.soft:hover{background:rgba(255,107,26,.25)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.danger:hover{background:rgba(255,90,115,.28)}
.btn.dark{background:var(--bg);color:var(--fg)}
.btn.dark:hover{background:var(--bg-2)}
.btn.sm{min-height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.btn.lg{min-height:52px;padding:0 28px;font-size:15px;border-radius:12px}
.btn.icon{width:32px;padding:0}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{color:var(--accent);font-weight:700;background:none;border:0;padding:0}
.link:hover{text-decoration:underline}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lbl{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.input{width:100%;background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--fg);font:inherit;min-height:40px}
textarea.input{resize:vertical;min-height:80px}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.input.err{border-color:var(--bad)}
.input[readonly]{color:var(--muted)}
.err-msg{color:var(--bad);font-size:12.5px;font-weight:600}
.err-msg:empty{display:none}
.hint{color:var(--faint);font-size:12.5px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form-grid .full{grid-column:1/-1}
.check{display:flex;gap:10px;align-items:center;font-weight:600}
.check input{accent-color:var(--accent);width:17px;height:17px}
.note{border-radius:10px;padding:12px 14px;background:var(--surface-2);border:1px solid var(--line);font-size:13.5px}
.note.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.note.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.note.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.note b{color:var(--fg)}
@media(max-width:560px){.form-grid{grid-template-columns:1fr}}

/* pills, chips */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.pill.plain::before{display:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-weight:600;font-size:13px;display:inline-flex;gap:8px;align-items:center}
.chip:hover{color:var(--fg);border-color:var(--line-2)}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:rgba(255,107,26,.5)}
.chip .cnt{font-size:11.5px;opacity:.8}

/* cards, tables */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0}
.card-pad{padding:18px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h h3{font-size:15px;font-weight:700}
.scroll-x{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.scroll-x .tbl{min-width:760px}
.tbl th{text-align:left;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:rgba(255,255,255,.025)}
.tbl .r{text-align:right}
.tbl .acts{display:flex;gap:6px;justify-content:flex-end}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.avatar.lg{width:64px;height:64px;font-size:22px}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who b{display:block;font-weight:700}
.who span{display:block;color:var(--muted);font-size:12.5px}
.who a{cursor:pointer}
.who a:hover b{color:var(--accent)}
.pager{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);color:var(--muted);flex-wrap:wrap}
.pager .pg{display:flex;gap:6px}
.empty{padding:44px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty .ic{color:var(--faint)}
.empty b{color:var(--fg);font-size:15px}
.bar-track{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;background:var(--ok);border-radius:99px}
.bar-fill.warn{background:var(--warn)}
.bar-fill.bad{background:var(--bad)}
.bar-fill.accent{background:var(--accent)}

/* modal + toast */
.overlay{position:fixed;inset:0;background:rgba(4,7,14,.76);backdrop-filter:blur(3px);z-index:100;display:flex;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) 16px 24px;overflow:auto}
.modal{width:100%;max-width:560px;background:var(--surface);border:1px solid var(--line-2);border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.55);margin:auto 0;min-width:0}
.modal.wide{max-width:780px}
.modal-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-h h3{font-family:var(--font-display);font-size:26px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;line-height:1}
.modal-b{padding:20px;display:flex;flex-direction:column;gap:14px}
.modal-f{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
#toast-root{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100% - 32px)}
.toast{background:var(--surface-2);border:1px solid var(--line-2);padding:10px 16px;border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.45);font-weight:600;display:flex;gap:10px;align-items:center;animation:rise .2s ease-out}
.toast.ok .ic{color:var(--ok)}
.toast.bad .ic{color:var(--bad)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* receipt */
.receipt{background:var(--paper);color:var(--paper-ink);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:14px}
.receipt h4{font-family:var(--font-display);font-size:28px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;line-height:1}
.receipt .sub{color:#4A5576;font-size:13px}
.receipt .rrow{display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px dashed var(--paper-line)}
.receipt .rrow span:first-child{color:#4A5576}
.receipt .rrow span:last-child{font-weight:700;text-align:right}
.receipt .amt{font-family:var(--font-display);font-size:48px;font-weight:900;line-height:1}
.receipt .sign{margin-top:18px;border-top:1px solid var(--paper-ink);padding-top:6px;width:200px;font-size:12px;color:#4A5576}

/* charts */
.bchart{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:var(--h,200px) auto;gap:8px 10px;padding-top:20px}
.yax{position:relative;width:44px}
.yax span{position:absolute;right:0;transform:translateY(50%);font-size:11px;color:var(--muted);line-height:1;white-space:nowrap}
.plot{position:relative;border-bottom:1px solid var(--line-2)}
.gl{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.cols{position:absolute;inset:0;display:flex;align-items:flex-end;gap:2%;padding-inline:1%}
.col{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;min-width:0}
.bar{width:min(100%,48px);background:var(--line-2);border-radius:6px 6px 0 0;position:relative;min-height:2px}
.bar.cur{background:var(--accent)}
.bv{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap;padding-bottom:4px;font-style:normal}
.bar.cur .bv{color:var(--accent)}
.xax{grid-column:2;display:flex;gap:2%;padding-inline:1%}
.xax span{flex:1;text-align:center;font-size:11.5px;color:var(--muted);min-width:0}
.donut{position:relative;width:150px;height:150px;flex:none}
.donut svg{width:100%;height:100%;transform:rotate(0deg)}
.donut .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.donut .mid b{font-family:var(--font-display);font-size:38px;font-weight:800;line-height:1}
.donut .mid span{font-size:11.5px;color:var(--muted)}
.legend{display:flex;flex-direction:column;gap:10px;flex:1;min-width:150px}
.legend div{display:flex;align-items:center;gap:10px}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend b{margin-left:auto;font-variant-numeric:tabular-nums}

/* ---------- public site ---------- */
.demo-bar{background:var(--bg-2);border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.demo-bar .wrap{display:flex;gap:12px;align-items:center;justify-content:center;padding-block:7px;flex-wrap:wrap;text-align:center}
.demo-bar .tag{background:var(--accent);color:var(--accent-ink);font-weight:800;border-radius:6px;padding:1px 7px;font-size:11px;letter-spacing:.08em}
.demo-bar button{background:none;border:0;color:var(--accent);font-weight:700;padding:0}
.ann{background:var(--accent-soft);color:var(--accent-2);font-weight:600;font-size:13.5px}
.ann .wrap{display:flex;gap:10px;align-items:center;justify-content:center;padding-block:9px;text-align:center}
.pnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(10,15,28,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.pnav-in{display:flex;align-items:center;gap:18px;min-height:68px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:900;font-size:25px;letter-spacing:.07em;text-transform:uppercase;min-width:0;line-height:1}
.brand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logo{width:36px;height:36px;border-radius:10px;background:var(--accent);display:grid;place-items:center;flex:none}
.plinks{display:flex;gap:2px;margin-left:auto}
.plinks a{padding:9px 13px;border-radius:8px;color:var(--muted);font-weight:600}
.plinks a:hover{color:var(--fg)}
.plinks a.on{color:var(--fg);box-shadow:inset 0 -2px 0 var(--accent);border-radius:0}
.burger{display:none;background:none;border:1px solid var(--line-2);border-radius:10px;width:40px;height:40px;place-items:center;margin-left:auto}
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(55% 75% at 82% 45%,rgba(255,107,26,.17),transparent 70%);pointer-events:none}
.hero-in{position:relative;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);align-items:center;gap:32px;padding-block:68px 56px}
.eyebrow{color:var(--accent);font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:12px}
.hero h1{font-family:var(--font-display);font-weight:900;font-size:clamp(3.6rem,9.5vw,7.4rem);line-height:.86;text-transform:uppercase;margin-top:14px;text-wrap:balance}
.hero h1 em,.phero h1 em{font-style:normal;color:var(--accent)}
.lead{max-width:52ch;color:var(--muted);font-size:17px;margin-top:22px}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.plate{width:100%;max-width:500px;justify-self:end;height:auto}
.plate .p-body{fill:var(--surface);stroke:var(--line-2);stroke-width:2}
.plate .p-rim{fill:none;stroke:var(--accent);stroke-width:12}
.plate .p-tick{fill:none;stroke:var(--line-2);stroke-width:10;stroke-dasharray:3 10.4}
.plate .p-face{fill:var(--surface-2);stroke:var(--line-2);stroke-width:2}
.plate .p-hole{fill:var(--bg);stroke:var(--line-2);stroke-width:3}
.plate text{font-family:var(--font-display);font-weight:900;fill:var(--fg);text-anchor:middle}
.plate .p-sm{font-family:var(--font-body);font-weight:800;fill:var(--muted);letter-spacing:.2em;font-size:15px}
.spin{transform-origin:260px 260px}
@media(prefers-reduced-motion:no-preference){.spin{animation:spin 140s linear infinite}}
@keyframes spin{to{transform:rotate(360deg)}}
.facts{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line)}
.fact{padding:22px 20px;border-left:1px solid var(--line)}
.fact:first-child{border-left:0}
.fact b{display:block;font-family:var(--font-display);font-size:clamp(1.5rem,3.2vw,2.1rem);font-weight:800;line-height:1.05;letter-spacing:.01em}
.fact span{color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.sec{padding-block:72px}
.sec.tight{padding-block:48px}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:32px}
.sec-h h2,.band h2{font-family:var(--font-display);font-weight:800;font-size:clamp(2.1rem,5.2vw,3.4rem);text-transform:uppercase;line-height:.95;margin-top:8px;text-wrap:balance}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.fitem{background:var(--bg);padding:26px;display:flex;flex-direction:column;gap:12px}
.fitem:hover{background:var(--surface)}
.fitem h3{font-size:18px;font-weight:800}
.fitem p{color:var(--muted)}
.ficon{width:46px;height:46px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px;display:flex;flex-direction:column;gap:14px;position:relative;min-width:0}
.pcard.feat{border-color:var(--accent);background:linear-gradient(180deg,rgba(255,107,26,.1),var(--surface) 55%)}
.pcard h3{font-size:19px;font-weight:800}
.ribbon{position:absolute;top:18px;right:18px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:99px}
.price{font-family:var(--font-display);font-weight:900;font-size:58px;line-height:1;display:flex;align-items:baseline;gap:4px}
.price .cur{font-size:30px;color:var(--accent)}
.flist{display:flex;flex-direction:column;gap:9px;margin:4px 0 8px}
.flist li{display:flex;gap:10px;align-items:flex-start;color:var(--fg)}
.flist .ic{color:var(--ok);margin-top:2px}
.pcard .btn{margin-top:auto}
.band{background:var(--accent);color:var(--accent-ink);border-radius:22px;padding:44px;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}
.band p{max-width:46ch;margin-top:10px;font-weight:600}
.phero{padding-block:60px 40px;border-bottom:1px solid var(--line);position:relative;overflow:hidden}
.phero::before{content:"";position:absolute;inset:0;background:radial-gradient(40% 90% at 90% 0%,rgba(255,107,26,.13),transparent 70%)}
.phero .wrap{position:relative}
.phero h1{font-family:var(--font-display);font-weight:900;font-size:clamp(2.8rem,7.5vw,5rem);line-height:.9;text-transform:uppercase;margin-top:10px}
.phero p{color:var(--muted);max-width:56ch;margin-top:14px;font-size:16px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:40px;align-items:start}
.prose p{color:var(--muted);font-size:16px;line-height:1.7}
.prose p+p{margin-top:16px}
.htable{width:100%;border-collapse:collapse}
.htable td{padding:14px 0;border-bottom:1px solid var(--line)}
.htable td:last-child{text-align:right;font-weight:700}
.htable td:first-child{color:var(--muted)}
.cmp{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.cmp th{text-align:left;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:12px 16px;border-bottom:1px solid var(--line-2)}
.cmp td{padding:16px;border-bottom:1px solid var(--line)}
.cmp td:first-child{font-weight:800}
.cmp .save{color:var(--ok);font-weight:700}
.info li{display:flex;gap:14px;padding:18px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.info li:first-child{padding-top:0}
.info .ficon{width:40px;height:40px}
.info b{display:block;font-weight:800;margin-bottom:2px}
.info span{color:var(--muted)}
.mapcard{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--bg-2)}
.mapcard svg{display:block;width:100%;height:auto}
.mapcard .map-f{padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line)}
.steps{display:flex;flex-direction:column;gap:22px;margin-top:28px}
.steps li{display:flex;gap:16px}

function statusOf(m){
  const ms=latestMs(m.id);
  if(!ms)return{key:'none',label:'No plan',cls:'plain',left:null,ms:null};
  const left=diffDays(ms.end,todayISO());
  if(left<0)return{key:'expired',label:'Expired',cls:'bad',left,ms};

}

function niceMax(v){if(v<=0)return 1000;const p=Math.pow(10,Math.floor(Math.log10(v))),f=v/p,n=f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10;return n*p;}
function barChart(items,o){
  o=o||{};const max=niceMax(Math.max.apply(null,items.map(i=>i.value).concat([0])));
  const fmt=o.fmt||compact,dense=items.length>8;
  const ticks=[0,.25,.5,.75,1];
  return '<div class="bchart" style="--h:'+(o.h||200)+'px"><div class="yax">'+ticks.map(f=>'<span style="bottom:'+(f*100)+'%">'+fmt(f*max)+'</span>').join('')+'</div><div class="plot">'+ticks.map(f=>'<i class="gl" style="bottom:'+(f*100)+'%"></i>').join('')+'<div class="cols">'+items.map(it=>'<div class="col"><div class="bar'+(it.cur?' cur':'')+'" style="height:'+(it.value/max*100).toFixed(2)+'%" title="'+esc(it.label+': '+(o.isCount?it.value:money(it.value)))+'">'+(dense&&!it.cur?'':'<b class="bv">'+fmt(it.value)+'</b>')+'</div></div>').join('')+'</div></div><div class="xax">'+items.map(it=>'<span>'+esc(it.label)+'</span>').join('')+'</div></div>';
}
function donut(parts,total){
  const sum=parts.reduce((s,p)=>s+p.v,0)||1;let off=25,seg='';
  parts.forEach(p=>{const pc=p.v/sum*100;if(pc>0)seg+='<circle r="15.9155" cx="21" cy="21" fill="none" stroke-width="5" style="stroke:'+p.c+'" stroke-dasharray="'+pc.toFixed(3)+' '+(100-pc).toFixed(3)+'" stroke-dashoffset="'+off.toFixed(3)+'"/>';off-=pc;});
  return '<div class="donut"><svg viewBox="0 0 42 42" role="img" aria-label="Membership status chart"><circle r="15.9155" cx="21" cy="21" fill="none" stroke-width="5" style="stroke:var(--surface-2)"/>'+seg+'</svg><div class="mid"><b>'+total+'</b><span>members</span></div></div>';
}

function filteredMembers(){
  const q=ui.mQuery.trim().toLowerCase(),qd=q.replace(/\D/g,'');
  let list=db.members.map(m=>({m,st:statusOf(m)}));
  if(q)list=list.filter(x=>x.m.name.toLowerCase().includes(q)||x.m.id.toLowerCase().includes(q)||(qd.length>=3&&x.m.phone.includes(qd)));
  if(ui.mFilter==='active')list=list.filter(x=>x.st.key==='active'||x.st.key==='expiring');
  else if(ui.mFilter!=='all')list=list.filter(x=>x.st.key===ui.mFilter);
  return list.sort((a,b)=>a.m.id<b.m.id?1:-1);
}

function tableHTML(head,rows,rightCols){
  rightCols=rightCols||[];
  return '<div class="scroll-x"><table class="tbl" style="min-width:420px"><thead><tr>'+head.map((h,i)=>'<th'+(rightCols.includes(i)?' class="r"':'')+'>'+h+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map((c,i)=>'<td'+(rightCols.includes(i)?' class="r num"':'')+'>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
}
function reportModel(tab){
  const y=ui.repYear,nowKey=todayISO().slice(0,7);
  const tile=(cls,label,val,sub)=>'<div class="tile '+cls+'"><span class="k">'+label+'</span><span class="v">'+val+'</span><span class="s">'+sub+'</span></div>';
  if(tab==='revenue'){
    const months=Array.from({length:12},(_,i)=>{const key=y+'-'+pad(i+1),ps=db.payments.filter(p=>p.date.startsWith(key));return{key,label:monthName(y,i),full:monthName(y,i,1),n:ps.length,total:ps.reduce((s,p)=>s+p.amount,0),cur:key===nowKey};});
    const total=months.reduce((s,m)=>s+m.total,0),count=months.reduce((s,m)=>s+m.n,0),best=months.reduce((a,b)=>b.total>a.total?b:a,months[0]);
    const byM={};db.payments.filter(p=>p.date.startsWith(y)).forEach(p=>{byM[p.method]=byM[p.method]||{n:0,t:0};byM[p.method].n++;byM[p.method].t+=p.amount;});
    const methods=Object.keys(byM).sort((a,b)=>byM[b].t-byM[a].t);
    const yearly={};db.payments.forEach(p=>{const k=p.date.slice(0,4);yearly[k]=yearly[k]||{n:0,t:0};yearly[k].n++;yearly[k].t+=p.amount;});
    const body='<div class="tiles">'+tile('acc','Revenue in '+y,money(total),count+' payments')+tile('','Best month',best.total?best.full:'—',best.total?money(best.total):'No payments')+tile('','Average per active month',money(Math.round(total/Math.max(1,months.filter(m=>m.total>0).length))),'Months with payments')+'</div>'+
    '<div class="card" style="margin-bottom:16px"><div class="card-h"><h3>Monthly revenue, '+y+'</h3></div><div class="card-pad">'+barChart(months.map(m=>({label:m.label,value:m.total,cur:m.cur})),{h:240})+'</div></div>'+
    '<div class="grid-2 even"><div class="card"><div class="card-h"><h3>Month by month</h3></div>'+tableHTML(['Month','Payments','Collected'],months.map(m=>[m.full,m.n,money(m.total)]),[1,2])+'</div><div class="stack"><div class="card"><div class="card-h"><h3>By payment method</h3></div>'+(methods.length?tableHTML(['Method','Payments','Amount','Share'],methods.map(k=>[esc(k),byM[k].n,money(byM[k].t),Math.round(byM[k].t/total*100)+'%']),[1,2,3]):emptyBox('rupee','No payments','Nothing collected in '+y+'.'))+'</div><div class="card"><div class="card-h"><h3>Yearly totals</h3></div>'+tableHTML(['Year','Payments','Collected'],Object.keys(yearly).sort().reverse().map(k=>[k,yearly[k].n,money(yearly[k].t)]),[1,2])+'</div></div></div>';
    return{name:'revenue-'+y,headers:['Month','Payments','Collected'],rows:months.map(m=>[m.full+' '+y,m.n,m.total]),body};
  }
  if(tab==='registrations'){
    const months=Array.from({length:12},(_,i)=>{const key=y+'-'+pad(i+1);return{label:monthName(y,i),full:monthName(y,i,1),n:db.members.filter(m=>m.regDate.startsWith(key)).length,cur:key===nowKey};});
    const total=months.reduce((s,m)=>s+m.n,0);
    const latest=db.members.filter(m=>m.regDate.startsWith(y)).sort((a,b)=>a.regDate<b.regDate?1:-1).slice(0,8);
    const body='<div class="tiles">'+tile('acc','New members in '+y,total,'Registered')+tile('','All-time members',db.members.length,'Currently on record')+'</div><div class="grid-2 even"><div class="card"><div class="card-h"><h3>New registrations, '+y+'</h3></div><div class="card-pad">'+barChart(months.map(m=>({label:m.label,value:m.n,cur:m.cur})),{h:220,fmt:v=>String(Math.round(v)),isCount:true})+'</div></div><div class="card"><div class="card-h"><h3>Latest registrations</h3></div>'+(latest.length?'<div class="rows">'+latest.map(m=>'<div class="row"><span class="avatar">'+initials(m.name)+'</span><div class="grow"><b>'+esc(m.name)+'</b><span>'+m.id+'</span></div><span class="muted">'+fd(m.regDate)+'</span></div>').join('')+'</div>':emptyBox('users','No registrations','Nobody registered in '+y+'.'))+'</div></div>';
    return{name:'registrations-'+y,headers:['Month','New members'],rows:months.map(m=>[m.full+' '+y,m.n]),body};
  }
  if(tab==='status'){
    const s=stats(),mix=db.plans.map(p=>({p,n:db.members.filter(m=>{const st=statusOf(m);return st.ms&&st.ms.planId===p.id&&(st.key==='active'||st.key==='expiring');}).length})),mx=Math.max(1,...mix.map(x=>x.n));
    const body='<div class="tiles">'+tile('ok','Active',s.healthy,'Healthy memberships')+tile('warn','Expiring soon',s.expiring,'Within '+db.settings.expiringDays+' days')+tile('bad','Expired',s.expired,'Need renewal')+tile('','No plan',s.none,'Registered only')+'</div><div class="grid-2 even"><div class="card"><div class="card-h"><h3>Active versus expired</h3></div><div class="card-pad" style="display:flex;gap:20px;align-items:center;flex-wrap:wrap">'+donut([{v:s.healthy,c:'var(--ok)'},{v:s.expiring,c:'var(--warn)'},{v:s.expired,c:'var(--bad)'},{v:s.none,c:'var(--line-2)'}],s.total)+'<div class="legend"><div><i style="background:var(--ok)"></i>Active<b>'+s.healthy+'</b></div><div><i style="background:var(--warn)"></i>Expiring soon<b>'+s.expiring+'</b></div><div><i style="background:var(--bad)"></i>Expired<b>'+s.expired+'</b></div><div><i style="background:var(--line-2)"></i>No plan<b>'+s.none+'</b></div></div></div></div><div class="card"><div class="card-h"><h3>Members per plan</h3></div><div class="card-pad">'+mix.map(x=>'<div class="stat-bar"><span class="nm">'+esc(x.p.name)+'</span><div class="bar-track"><div class="bar-fill accent" style="width:'+(x.n/mx*100)+'%"></div></div><b>'+x.n+'</b></div>').join('')+'</div></div></div>';
    return{name:'membership-status',headers:['Status','Members'],rows:[['Active',s.healthy],['Expiring soon',s.expiring],['Expired',s.expired],['No plan',s.none]],body};
  }
  if(tab==='renewals'){
    const l=queue(30,0),rows=l.map(x=>[esc(x.m.name),esc(dispPhone(x.m.phone)),esc(x.st.ms.planName),fd(x.st.ms.end),x.st.left+' days',money((planById(x.st.ms.planId)||x.st.ms).price)]);
    const body='<div class="tiles">'+tile('warn','Due in 30 days',l.length,'Memberships')+tile('acc','Expected renewal value',money(l.reduce((s,x)=>s+(planById(x.st.ms.planId)||x.st.ms).price,0)),'At current plan prices')+'</div><div class="card">'+(l.length?tableHTML(['Member','Phone','Plan','Expiry','Days left','Renewal price'],rows,[5]):emptyBox('check','Nothing due','No memberships expire in the next 30 days.'))+'</div>';
    return{name:'upcoming-renewals',headers:['Member','Phone','Plan','Expiry','Days left','Renewal price'],rows:l.map(x=>[x.m.name,x.m.phone,x.st.ms.planName,x.st.ms.end,x.st.left,(planById(x.st.ms.planId)||x.st.ms).price]),body};
  }
  const l=duesList(),tot=l.reduce((s,ms)=>s+dueOf(ms),0);
  const body='<div class="tiles">'+tile('bad','Total outstanding',money(tot),l.length+' memberships')+tile('','Collected so far',money(db.payments.reduce((s,p)=>s+p.amount,0)),'All payments')+'</div><div class="card"><div class="card-h"><h3>Outstanding dues</h3></div>'+duesHTML()+'</div>';
  return{name:'outstanding-dues',headers:['Member ID','Member','Plan','Start','End','Price','Paid','Due'],rows:l.map(ms=>{const m=memberById(ms.memberId);return [ms.memberId,m?m.name:'',ms.planName,ms.start,ms.end,ms.price,paidOf(ms.id),dueOf(ms)];}),body};
}
function aReports(){
  const tabs=[['revenue','Revenue'],['registrations','New members'],['status','Membership status'],['renewals','Upcoming renewals'],['dues','Dues']];
  const m=reportModel(ui.repTab),yearly=ui.repTab==='revenue'||ui.repTab==='registrations';
  return '<div class="page-head"><div><h1>Reports and analytics</h1><p class="muted">Revenue, registrations, renewals and dues.</p></div><div class="actions">'+(yearly?'<select class="input" style="width:auto" data-bind="repYear" data-render="1" aria-label="Year">'+reportYears().map(y=>'<option'+(ui.repYear===y?' selected':'')+'>'+y+'</option>').join('')+'</select>':'')+'<button class="btn ghost" data-act="exportReport">'+ic('download')+'Export CSV</button></div></div><div class="tabs" role="tablist">'+tabs.map(t=>'<button role="tab" aria-selected="'+(ui.repTab===t[0])+'" data-act="setTab" data-key="repTab" data-val="'+t[0]+'">'+t[1]+'</button>').join('')+'</div>'+m.body;
}

const getPath=(o,p)=>p.split('.').reduce((a,k)=>a==null?a:a[k],o);
function setPath(o,p,v){const k=p.split('.');let a=o;for(let i=0;i<k.length-1;i++)a=a[k[i]];a[k[k.length-1]]=v;}
function wf(label,path,o){
  o=o||{};const v=getPath(ui.web,path),id='w-'+path.replace(/\./g,'-');
  const ctl=o.area?'<textarea class="input" id="'+id+'" data-path="'+path+'" rows="'+o.area+'">'+esc(v)+'</textarea>':'<input class="input" id="'+id+'" data-path="'+path+'" type="'+(o.type||'text')+'" value="'+esc(v)+'"'+(o.ph?' placeholder="'+esc(o.ph)+'"':'')+'>';
  return '<div class="field'+(o.full?' full':'')+'"><label for="'+id+'">'+label+'</label>'+ctl+'<span class="err-msg" data-err="'+path+'"></span>'+(o.hint?'<span class="hint">'+o.hint+'</span>':'')+'</div>';
}

  }
  return '<div class="page-head"><div><h1>Settings and database</h1><p class="muted">Membership rules, payment methods, storage and backups.</p></div></div><div class="tabs" role="tablist">'+tabs.map(t=>'<button role="tab" aria-selected="'+(ui.setTab===t[0])+'" data-act="setTab" data-key="setTab" data-val="'+t[0]+'">'+t[1]+'</button>').join('')+'</div>'+body;

/* ================= modals & forms ================= */
let modalCfg=null;
function openModal(o){
  modalCfg=o;
  $('#modal-root').innerHTML='<div class="overlay"><div class="modal'+(o.wide?' wide':'')+'" role="dialog" aria-modal="true" aria-label="'+esc(o.title)+'"><div class="modal-h"><h3>'+esc(o.title)+'</h3><button class="btn ghost sm icon" data-act="closeModal" aria-label="Close">'+ic('x',16)+'</button></div><form data-form="modal" novalidate><div class="modal-b">'+o.body+'<span class="err-msg" data-err="_"></span></div><div class="modal-f">'+(o.footer||'<button type="button" class="btn ghost" data-act="closeModal">Cancel</button><button class="btn" type="submit">'+(o.submit||'Save')+'</button>')+'</div></form></div></div>';
  if(!o.noFocus){const f=$('#modal-root input:not([type=hidden]):not([disabled]):not([type=checkbox]),#modal-root select,#modal-root textarea');if(f&&f.focus)f.focus();}
  return $('#modal-root form');
}
function closeModal(){$('#modal-root').innerHTML='';modalCfg=null;}
function fail(form,errs){
  form.querySelectorAll('.err-msg').forEach(e=>{e.textContent='';});
  form.querySelectorAll('.input.err').forEach(e=>e.classList.remove('err'));
  let first=null;
  Object.keys(errs).forEach(k=>{
    const sp=form.querySelector('[data-err="'+k+'"]');if(sp)sp.textContent=errs[k];
    const inp=form.elements[k]||form.querySelector('[data-path="'+k+'"]');
    if(inp&&inp.classList){inp.classList.add('err');if(!first)first=inp;}
  });
  if(first&&first.focus)first.focus();
  return false;
}
function confirmModal(o){
  openModal({title:o.title,noFocus:true,body:'<p>'+o.message+'</p>',footer:'<button type="button" class="btn ghost" data-act="closeModal">Cancel</button><button class="btn '+(o.danger?'danger':'')+'" type="submit">'+o.label+'</button>',onSubmit:()=>{o.onYes();return true;}});
}

function setHash(r){try{if(location.hash.slice(1)!==r)location.hash=r;}catch(e){}}
function go(r,noHash){
  if(ADMIN.includes(r)&&!state.authed){pendingRoute=r;r='login';}
  if(r==='login'&&state.authed)r='a-dashboard';
  if(r==='a-member'&&!memberById(ui.memberId))r='a-members';
  if(!PUBLIC.includes(r)&&!ADMIN.includes(r)&&r!=='login')r='home';
  if(route==='a-website'&&r!=='a-website')ui.web=null;
  route=r;document.body.classList.remove('side-open');
  if(!noHash)setHash(r);
  render();window.scrollTo(0,0);
}
function toast(msg,kind){
  const el=document.createElement('div');el.className='toast '+(kind||'ok');
  el.innerHTML=ic(kind==='bad'?'alert':'check',16)+'<span>'+esc(msg)+'</span>';
  $('#toast-root').appendChild(el);setTimeout(()=>{el.remove();},3400);
}
function copyText(text,msg,ta){
  const done=()=>toast(msg||'Copied');
  const fb=()=>{try{const t=ta||document.createElement('textarea');if(!ta){t.value=text;t.style.cssText='position:fixed;opacity:0;top:0;left:0';document.body.appendChild(t);}t.select();const ok=document.execCommand&&document.execCommand('copy');if(!ta)t.remove();ok?done():toast('Text selected. Press Ctrl+C to copy.','bad');}catch(e){toast('Select the text and copy it manually.','bad');}};
  try{navigator.clipboard.writeText(text).then(done,fb);}catch(e){fb();}
}

  toggleNav:()=>{const n=$('.pnav');if(n)n.classList.toggle('open');},
  toggleSide:()=>document.body.classList.toggle('side-open'),
  closeSide:()=>document.body.classList.remove('side-open'),
  demoLogin:()=>{$('#l-user').value='admin';$('#l-pass').value='demo1234';},
  logout:()=>{state.authed=false;closeModal();go('home');toast('Signed out');},
  setFilter:el=>{ui[el.dataset.key]=el.dataset.val;if(el.dataset.reset)ui[el.dataset.reset]=1;rerender();},
  setTab:el=>{ui[el.dataset.key]=el.dataset.val;rerender();},
  page:el=>{ui[el.dataset.key]=+el.dataset.n;refreshPart(el.dataset.part);},
  closeModal:()=>closeModal(),
  addMember:()=>openMemberModal(null),
  editMember:el=>openMemberModal(memberById(el.dataset.id)),
  deleteMember:el=>deleteMember(memberById(el.dataset.id)),
  openRenew:el=>openRenewModal({memberId:el.dataset.id,planId:el.dataset.plan}),
  openPay:el=>openPayModal({memberId:el.dataset.id,msId:el.dataset.ms}),
  receipt:el=>openReceipt(el.dataset.id),
  exportMembers:()=>{const c=csvMembers();openExport('members',c[0],c[1]);},
  exportPayments:()=>openExport('payments',['Payment ID','Date','Member ID','Member','Plan','Method','Reference','Notes','Amount'],db.payments.slice().sort(payDesc).map(p=>{const m=memberById(p.memberId),x=msById(p.membershipId);return [p.id,p.date,p.memberId,m?m.name:'',x?x.planName:'',p.method,p.ref,p.notes,p.amount];})),
  exportMemberships:()=>openExport('memberships',['Membership ID','Member ID','Member','Plan','Type','Start','End','Price','Paid','Due'],db.memberships.slice().sort((a,b)=>a.start<b.start?1:-1).map(x=>{const m=memberById(x.memberId);return [x.id,x.memberId,m?m.name:'',x.planName,x.type,x.start,x.end,x.price,paidOf(x.id),dueOf(x)];})),
  exportReport:()=>{const m=reportModel(ui.repTab);openExport(m.name,m.headers,m.rows);},
  newPlan:()=>openPlanModal(null),
  editPlan:el=>openPlanModal(planById(el.dataset.id)),
  togglePlan:el=>{const p=planById(el.dataset.id);p.active=!p.active;save();toast(p.name+(p.active?' is now available':' is now hidden'));rerender();},
  deletePlan:el=>{const p=planById(el.dataset.id),n=db.memberships.filter(x=>x.planId===p.id).length;if(n){toast('Used by '+n+' memberships. Deactivate it instead.','bad');return;}confirmModal({title:'Delete plan?',danger:true,label:'Delete plan',message:'<b>'+esc(p.name)+'</b> will be removed. No members are using it.',onYes:()=>{db.plans=db.plans.filter(x=>x.id!==p.id);save();toast('Plan deleted');rerender();}});},
  viewEnq:el=>openEnquiry(el.dataset.id),
  convertEnq:el=>{const q=db.enquiries.find(x=>x.id===el.dataset.id);closeModal();openMemberModal(null,{name:q.name,phone:q.phone,planId:q.planId,enqId:q.id});},
  deleteEnq:el=>{const q=db.enquiries.find(x=>x.id===el.dataset.id);confirmModal({title:'Delete enquiry?',danger:true,label:'Delete enquiry',message:'The enquiry from <b>'+esc(q.name)+'</b> will be removed.',onYes:()=>{db.enquiries=db.enquiries.filter(x=>x.id!==q.id);save();toast('Enquiry deleted');rerender();}});},
  addHour:()=>{ui.web.hours.push({days:'',time:''});rerender();},
  delHour:el=>{ui.web.hours.splice(+el.dataset.i,1);rerender();},
  addFac:()=>{ui.web.facilities.push({id:'F'+Date.now(),type:'space',icon:'dumbbell',title:'New facility',desc:'Describe this facility.'});rerender();},
  delFac:el=>{ui.web.facilities.splice(+el.dataset.i,1);rerender();},
  discardWeb:()=>{ui.web=clone(db.settings);rerender();toast('Changes discarded');},
  addMethod:()=>{const i=$('#newMethod'),v=i.value.trim();if(!v){toast('Type a payment method first.','bad');return;}if(db.settings.methods.some(m=>m.toLowerCase()===v.toLowerCase())){toast('That method already exists.','bad');return;}db.settings.methods.push(v);save();rerender();toast(v+' added');},
  delMethod:el=>{if(db.settings.methods.length<=1){toast('Keep at least one payment method.','bad');return;}db.settings.methods.splice(+el.dataset.i,1);save();rerender();},
  copyReminder:el=>{const m=memberById(el.dataset.id),st=statusOf(m);copyText(reminderMsg(m,st),'Reminder copied');},
  copy:el=>copyText(el.dataset.text,'Copied'),
  copyEl:el=>{const t=document.getElementById(el.dataset.el);copyText(t.value,'Copied',t);},
  profile:()=>openProfile(),
  copyBackup:()=>copyText(JSON.stringify(db),'Backup copied'),
  showBackup:()=>{openModal({title:'Backup (JSON)',wide:true,noFocus:true,body:'<textarea class="input codebox" id="bkText" readonly>'+esc(JSON.stringify(db,null,1))+'</textarea>',footer:'<button type="button" class="btn ghost" data-act="closeModal">Close</button><button type="button" class="btn" data-act="copyEl" data-el="bkText">'+ic('copy',16)+'Copy backup</button>'});},
  resetDemo:()=>confirmModal({title:'Reset demo data?',danger:true,label:'Reset everything',message:'All changes, new members and enquiries will be replaced with the original sample data.',onYes:()=>{db=seed();save();toast('Demo data restored');rerender();}}),
  dbChoice:el=>{ui.dbChoice=el.dataset.val;rerender();},
  testConn:()=>toast('Connection tests run in the full build.','bad'),
  gsGo:el=>{const t=el.dataset.t,id=el.dataset.id;const pop=$('#gsp');if(pop)pop.hidden=true;if(t==='m')acts.goMember({dataset:{id}});else if(t==='p')openReceipt(id);else openEnquiry(id);}
};
const forms={
  login:f=>{
    const e=f.elements,errs={};
    if(!e.user.value.trim())errs.user='Enter your username.';
    if(!e.pass.value)errs.pass='Enter your password.';else if(e.pass.value.length<4)errs.pass='Password must be at least 4 characters.';
    if(Object.keys(errs).length)return fail(f,errs);
    state.authed=true;const next=pendingRoute||'a-dashboard';pendingRoute=null;go(next);toast('Signed in');
  },
  join:f=>{
    const e=f.elements,errs={},name=e.name.value.trim(),ph=normPhone(e.phone.value);
    if(name.length<2)errs.name='Please enter your name.';
    if(!validPhone(ph))errs.phone='Enter a valid 10-digit mobile number.';
    if(Object.keys(errs).length)return fail(f,errs);
    const enq={id:nextId('ENQ',db.enquiries),name,phone:ph,planId:e.planId.value,message:e.message.value.trim(),date:todayISO(),status:'New',notes:''};
    db.enquiries.push(enq);save();ui.joined=enq;ui.joinPlan='';rerender();
  },
  modal:f=>{if(modalCfg&&modalCfg.onSubmit&&modalCfg.onSubmit(f)===true)closeModal();},
  rules:f=>{
    const e=f.elements,errs={},exp=Number(e.expiringDays.value);
    if(!Number.isInteger(exp)||exp<1||exp>30)errs.expiringDays='Enter a whole number from 1 to 30.';
    if(Object.keys(errs).length)return fail(f,errs);
    const rd=[...f.querySelectorAll('input[name=rd]:checked')].map(x=>+x.value).sort((a,b)=>b-a);
    Object.assign(db.settings,{currency:e.currency.value,expiringDays:exp,renewRule:e.renewRule.value,allowInstalments:e.allowInstalments.checked,reminderDays:rd,reminderTemplate:e.reminderTemplate.value.trim()||defaultSettings().reminderTemplate});
    save();toast('Settings saved');rerender();
  },
  website:f=>{
    const w=ui.web,errs={};
    if(!w.gymName.trim())errs.gymName='Enter the gym name.';
    if(!w.phone.trim())errs.phone='Enter a phone number.';
    if(w.email.trim()&&!validEmail(w.email.trim()))errs.email='Enter a valid email or leave it blank.';
    if(w.whatsapp.trim()&&w.whatsapp.replace(/\D/g,'').length<10)errs.whatsapp='Enter the number with country code, digits only.';
    if(Object.keys(errs).length){fail(f,errs);toast('Fix the highlighted fields.','bad');return false;}
    const c=clone(w);c.whatsapp=c.whatsapp.replace(/\D/g,'');c.hours=c.hours.filter(h=>h.days.trim()||h.time.trim());c.facilities=c.facilities.filter(x=>x.title.trim());
    ['gymName','tagline','heroText','about','stationCount','trainerCount','phone','whatsapp','email','address','hours','announcement','facilities'].forEach(k=>{db.settings[k]=c[k];});
    save();ui.web=clone(db.settings);rerender();toast('Website updated. Open the public site to see it.');
  },
  restore:f=>{
    let d;try{d=JSON.parse(f.elements.json.value);}catch(e){return fail(f,{json:'That is not valid backup JSON.'});}
    if(!d||d.v!==1||!d.settings||!Array.isArray(d.members)||!Array.isArray(d.memberships)||!Array.isArray(d.payments)||!Array.isArray(d.plans))return fail(f,{json:'This does not look like a GOLD GYM backup.'});
    if(!Array.isArray(d.enquiries))d.enquiries=[];if(!d.profile)d.profile=db.profile;
    db=d;save();toast('Backup restored');rerender();
  }
};

document.addEventListener('click',e=>{
  if(e.target.classList&&e.target.classList.contains('overlay')){closeModal();return;}
  if(!e.target.closest('.gsearch')){const pop=$('#gsp');if(pop)pop.hidden=true;}
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=acts[el.dataset.act];if(!a)return;
  if(el.tagName==='A'||(el.tagName==='BUTTON'&&el.form))e.preventDefault();
  a(el,e);
});
function onField(e){
  const t=e.target;if(!t||!t.dataset)return;
  if(t.dataset.gs){const pop=$('#gsp'),h=gsResults(t.value);if(pop){pop.innerHTML=h;pop.hidden=!h;}return;}
  if(t.dataset.bind){ui[t.dataset.bind]=t.value;if(t.dataset.reset)ui[t.dataset.reset]=1;if(t.dataset.render){if(e.type==='change')rerender();}else if(t.dataset.part)refreshPart(t.dataset.part);}
  if(t.dataset.path&&ui.web)setPath(ui.web,t.dataset.path,t.type==='checkbox'?t.checked:t.value);
  if(t.dataset.live&&live[t.dataset.live]&&t.form)live[t.dataset.live](t.form);
  if(e.type==='change'&&t.dataset.chg&&chg[t.dataset.chg])chg[t.dataset.chg](t);
}
document.addEventListener('input',onField);
document.addEventListener('change',onField);
document.addEventListener('submit',e=>{
  const f=e.target;if(!f||!f.dataset||!f.dataset.form)return;
  e.preventDefault();const h=forms[f.dataset.form];if(h)h(f);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(modalCfg)closeModal();const pop=$('#gsp');if(pop)pop.hidden=true;}
  if(e.key==='Enter'&&e.target&&e.target.dataset&&e.target.dataset.gs){e.preventDefault();ui.mQuery=e.target.value.trim();ui.mFilter='all';ui.mPage=1;go('a-members');}
});
window.addEventListener('hashchange',()=>{try{const h=location.hash.slice(1);if(h&&h!==route)go(h,true);}catch(e){}});

/* ================= boot ================= */
(function boot(){
  let h='';try{h=location.hash.slice(1);}catch(e){}
  route='home';
  if(h&&h!=='home'){
    if(PUBLIC.includes(h))route=h;
    else if(h==='login'||ADMIN.includes(h)){route='login';if(ADMIN.includes(h)&&h!=='a-member')pendingRoute=h;}
  }
  render();
})();
})();
</script>
